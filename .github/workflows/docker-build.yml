name: Docker Build Check

on:
  push:
    branches:
      - react-app
  pull_request:
    branches:
      - react-app

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Build frontend image
        run: docker build -t my-frontend ./my-react-app

      - name: Build backend image
        run: docker build -t my-backend ./backend

